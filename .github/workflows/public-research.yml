name: Public dataset research experiment

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'inferbench/public_sentiment.py'
      - 'tests/test_public_sentiment.py'
      - '.github/workflows/public-research.yml'

permissions:
  contents: read

jobs:
  sentiment:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-research.txt
      - run: python -m unittest tests.test_public_sentiment -v
      - name: Run cross-domain public dataset experiment
        run: python -m inferbench.public_sentiment --output public-sentiment.json
        env:
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
      - uses: actions/upload-artifact@v4
        with:
          name: public-sentiment-study
          path: public-sentiment.json
