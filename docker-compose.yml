services:
  apicalai-api:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      APICALAI_HOST: "0.0.0.0"
      APICALAI_PORT: "8080"
      APICALAI_DB_PATH: "/app/data/apicalai.sqlite3"
      APICALAI_API_KEY: "${APICALAI_API_KEY:-}"
      APICALAI_ADMIN_TOKEN: "${APICALAI_ADMIN_TOKEN:-}"
    volumes:
      - app-data:/app/data
    restart: unless-stopped

volumes:
  app-data:
