services:
  apicalai-api:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      APICALAI_HOST: "0.0.0.0"
      APICALAI_PORT: "8080"
      APICALAI_DB_PATH: "/app/data/apicalai.sqlite3"
      APICALAI_API_KEY: "${APICALAI_API_KEY:-}"
      APICALAI_ADMIN_TOKEN: "${APICALAI_ADMIN_TOKEN:-}"
      APICALAI_ALLOWED_ORIGIN: "${APICALAI_ALLOWED_ORIGIN:-}"
      APICALAI_OLLAMA_MODEL: "${APICALAI_OLLAMA_MODEL:-}"
      APICALAI_OLLAMA_URL: "${APICALAI_OLLAMA_URL:-http://host.docker.internal:11434}"
      APICALAI_MODEL_POOL: "${APICALAI_MODEL_POOL:-}"
      APICALAI_EMBED_MODEL: "${APICALAI_EMBED_MODEL:-}"
      APICALAI_WORKSPACE_DB: "${APICALAI_WORKSPACE_DB:-}"
      APICALAI_WORKSPACE_INVITE: "${APICALAI_WORKSPACE_INVITE:-}"
      APICALAI_WORKSPACE_QUOTA: "${APICALAI_WORKSPACE_QUOTA:-100}"
    volumes:
      - app-data:/app/data
    restart: unless-stopped

volumes:
  app-data:
